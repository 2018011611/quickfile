name: Build quickfile & Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: '是否发布为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.arch }} · SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_generic
          - x86_64
        sdk:
          - "25.12"
          - "24.10"

    steps:
      - uses: actions/checkout@v4

      # 修复gh-action-sdk chown exit code=2 权限问题
      - name: Fix workspace permission
        run: sudo chown -R runner:runner $GITHUB_WORKSPACE

      - name: Build packages
        uses: openwrt/gh-action-sdk@v2
        env:
          ARCH: ${{ matrix.sdk == '25.12' ? matrix.arch : format('{0}-openwrt-{1}',matrix.arch,matrix.sdk) }}
          FEEDNAME: quickfile
          PACKAGES: quickfile luci-app-quickfile luci-i18n-quickfile-zh-cn
          NO_REFRESH_CHECK: true
          INDEX: 1

      - name: Collect packages
        run: |
          ARCH="${{ matrix.arch }}"
          SDK="${{ matrix.sdk }}"
          mkdir -p dist/release dist/feed

          # 针对 SDK 24.10 (IPK)：替换~符号，文件名本身自带架构
          if [ "$SDK" = "24.10" ]; then
            for f in bin/packages/${ARCH}/quickfile/*.ipk; do
              [ -f "$f" ] || continue
              [[ "$(basename $f)" == Packages* ]] && continue
              base=$(basename "$f" .ipk)
              safe="${base//\~/.}"
              cp -v "$f" "dist/release/${safe}.ipk"
              cp -v "$f" dist/feed/
            done
            for f in bin/packages/${ARCH}/quickfile/Packages*; do
              [ -f "$f" ] || continue
              cp -v "$f" dist/feed/
            done
          fi

          # 针对 SDK 25.12 (APK)：发包区追加架构后缀，防止同名文件覆盖，同时匹配 Release Notes 逻辑
          if [ "$SDK" = "25.12" ]; then
            for f in bin/packages/${ARCH}/quickfile/*.apk; do
              [ -f "$f" ] || continue
              [[ "$(basename $f)" == APKINDEX* ]] && continue
              base=$(basename "$f" .apk)
              safe="${base//\~/.}"
              # feed 区保留原生包名，Release 发包区加上架构后缀区分
              cp -v "$f" "dist/release/${safe}_${ARCH}.apk"
              cp -v "$f" "dist/feed/${safe}.apk"
            done
            for f in bin/packages/${ARCH}/quickfile/APKINDEX*; do
              [ -f "$f" ] || continue
              cp -v "$f" dist/feed/
            done
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-sdk${{ matrix.sdk }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: packages-*

      - name: Flatten release files
        run: |
          mkdir -p dist
          find all-artifacts -path "*/release/*" -type f -exec cp -v {} dist/ \;

      - name: Determine tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          ARCHS="aarch64_cortex-a53 aarch64_generic x86_64"

          {
            echo "## 📦 SDK 24.10 · (IPK)"
            echo ""
            echo "| 架构 | quickfile | luci-app-quickfile | luci-i18n-quickfile-zh-cn |"
            echo "| :--- | :--- | :--- | :--- |"
            luci_ipk=$(ls dist/luci-app-quickfile_*_all.ipk 2>/dev/null | head -1)
            luci_ipk_link=$( [ -n "$luci_ipk" ] && echo "[$(basename $luci_ipk)](${BASE}/$(basename $luci_ipk))" || echo "—" )
            luci_i18n_ipk=$(ls dist/luci-i18n-quickfile-zh-cn_*_all.ipk 2>/dev/null | head -1)
            luci_i18n_link=$( [ -n "$luci_i18n_ipk" ] && echo "[$(basename $luci_i18n_ipk)](${BASE}/$(basename $luci_i18n_ipk))" || echo "—" )

            for arch in $ARCHS; do
              f=$(ls dist/quickfile_*_${arch}.ipk 2>/dev/null | head -1)
              link=$( [ -n "$f" ] && echo "[$(basename $f)](${BASE}/$(basename $f))" || echo "—" )
              echo "| \`${arch}\` | ${link} | ${luci_ipk_link} | ${luci_i18n_link} |"
            done

            echo ""
            echo "## 📦 SDK 25.12 · (APK)"
            echo ""
            echo "| 架构 | quickfile | luci-app-quickfile | luci-i18n-quickfile-zh-cn |"
            echo "| :--- | :--- | :--- | :--- |"
            for arch in $ARCHS; do
              f_core=$(ls dist/quickfile_*_${arch}.apk 2>/dev/null | head -1)
              f_luci=$(ls dist/luci-app-quickfile_*_${arch}.apk 2>/dev/null | head -1)
              f_i18n=$(ls dist/luci-i18n-quickfile-zh-cn_*_${arch}.apk 2>/dev/null | head -1)
              link_core=$( [ -n "$f_core" ] && echo "[$(basename $f_core)](${BASE}/$(basename $f_core))" || echo "—" )
              link_luci=$( [ -n "$f_luci" ] && echo "[$(basename $f_luci)](${BASE}/$(basename $f_luci))" || echo "—" )
              link_i18n=$( [ -n "$f_i18n" ] && echo "[$(basename $f_i18n)](${BASE}/$(basename $f_i18n))" || echo "—" )
              echo "| \`${arch}\` | ${link_core} | ${link_luci} | ${link_i18n} |"
            done
          } > release_notes.md

          cat release_notes.md

      - name: Replace Existing Manual Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" -R "$REPO" --yes --cleanup-tag
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
